
services:
  # 1. Root Next.js Landing Page & Companion Express API
  root-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000" # Next.js Port
      - "4001:4001" # Companion Express API Port (Avoids conflict on 4000)
    environment:
      - PORT=3000
      - EXPRESS_PORT=4001
      - NODE_ENV=production
      - WORKFLOW_DATABASE_URL=file:./dev.db
    restart: always

  # 2. Automation Workflow Core Backend Engine
  automation-backend:
    build:
      context: .
      dockerfile: automation-workflow/backend/Dockerfile
    ports:
      - "4000:4000" # REST Engine API Port
    environment:
      - PORT=4000
      - DATABASE_URL=file:/app/database/dev.db
      - WORKFLOW_DATABASE_URL=file:/app/database/dev.db
      - RABBITMQ_URL=amqp://guest:guest@automation-engine-rabbitmq:5672
      - RABBITMQ_QUEUE_NAME=neuron_flow_queue
    volumes:
      - db-data:/app/database
    depends_on:
      automation-engine-rabbitmq:
        condition: service_healthy
    restart: always

  # 3. Automation Workflow React Flow Frontend Canvas
  automation-frontend:
    build:
      context: ./automation-workflow/frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80" # Vite UI dev port proxy mapping (Nginx hosts index)
    depends_on:
      - automation-backend
    restart: always

  # 4. Automation Engine Postgres Database
  automation-engine-postgres:
    image: postgres:16-alpine
    container_name: automation-engine-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: automation
    ports:
      - "5432:5432"
    volumes:
      - engine-pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 5. Automation Engine Redis
  automation-engine-redis:
    image: redis:7-alpine
    container_name: automation-engine-redis
    ports:
      - "6379:6379"
    volumes:
      - engine-redisdata:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 6. Automation Engine Production-Grade Next.js UI & Web Server
  automation-engine-web:
    build:
      context: ./automation-engine
      dockerfile: Dockerfile
    ports:
      - "5174:3001" # Mapped to port 5174 as referenced in the root landing page
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DATABASE_URL=file:/app/packages/db/prisma/data/dev.db
    volumes:
      - engine-db-data:/app/packages/db/prisma/data
    depends_on:
      automation-engine-postgres:
        condition: service_healthy
      automation-engine-redis:
        condition: service_healthy
    restart: always

  # 7. Automation Engine RabbitMQ
  automation-engine-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: automation-engine-rabbitmq
    ports:
      - "5672:5672"   # AMQP protocol port
      - "15672:15672" # Management UI dashboard
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - engine-rabbitmqdata:/var/lib/rabbitmq
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data:
  engine-db-data:
  engine-pgdata:
  engine-redisdata:
  engine-rabbitmqdata:


