<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEURON_FLOW | Workflow Editor</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Mona+Sans:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "nf-primary": "#ff4f00",
              "nf-on-primary": "#fffefb",
              "nf-ink": "#201515",
              "nf-ink-soft": "#2f2a26",
              "nf-ink-mid": "#36342e",
              "nf-body": "#605d52",
              "nf-body-mid": "#939084",
              "nf-mute": "#c5c0b1",
              "nf-canvas": "#fffefb",
              "nf-canvas-soft": "#f8f4f0",
              "primary": "#ff4f00",
              "on-primary": "#fffefb",
              "ink": "#201515",
              "canvas": "#fffefb",
              "canvas-soft": "#f8f4f0"
            },
            borderRadius: {
              "none": "0px",
              "sm": "6px",
              "md": "12px",
              "pill": "9999px",
              "full": "9999px"
            },
            spacing: {
              "xxs": "2px",
              "xs": "4px",
              "sm": "8px",
              "md": "12px",
              "lg": "16px",
              "xl": "24px",
              "2xl": "32px",
              "3xl": "48px",
              "4xl": "64px"
            },
            fontFamily: {
              "display": ["Mona Sans", "Degular Display", "Inter", "sans-serif"],
              "body": ["Inter", "system-ui", "sans-serif"],
              "mono": ["JetBrains Mono", "monospace"]
            }
          }
        }
      }
    </script>
    <style>
      .material-symbols-outlined {
        display: none !important;
      }
      body {
        background-color: #fffefb;
        color: #201515;
        font-family: 'Inter', sans-serif;
      }
      .dot-grid {
        background-image: radial-gradient(circle, rgba(32, 21, 21, 0.08) 1px, transparent 1px);
        background-size: 24px 24px;
      }
      .node-card {
        background: #f8f4f0;
        border: 1px solid #c5c0b1;
        border-radius: 12px;
        transition: all 0.2s ease-in-out;
      }
      .node-card:hover {
        border-color: #201515;
        box-shadow: 0 4px 12px rgba(32, 21, 21, 0.06);
      }
    </style>
  </head>
  <body class="bg-[#fffefb] text-[#201515] font-body m-0 p-0 h-screen overflow-hidden">
    <div id="root" class="w-full h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
